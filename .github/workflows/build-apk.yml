name: Compilar APK Gratis (RutaSV Offline)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Preparar debug.keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Verificar datos offline de El Salvador
        run: gradle :app:prepareElSalvadorOfflineData --no-configuration-cache

      - name: Compilar APK Debug
        run: gradle :app:assembleDebug

      - name: Subir APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: RutaSV-Offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
