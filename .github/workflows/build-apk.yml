name: Compilar APK Gratis (RutaSV Offline)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK y licencias
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_DIR" > local.properties
          SDKMGR="$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager | head -n 1)"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          fi

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generar debug.keystore temporal para CI
        run: |
          rm -f debug.keystore
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verificar datos offline de El Salvador
        run: |
          if [ ! -f app/src/main/assets/el-salvador.map ] || [ ! -f app/src/main/assets/el-salvador-gh53.zip ]; then
            gradle :app:prepareElSalvadorOfflineData --no-configuration-cache
          fi

      - name: Compilar APK Debug
        run: gradle :app:assembleDebug --no-configuration-cache

      - name: Subir APK descargable (ZIP en Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: RutaSV-Offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar APK directo en Releases (sin ZIP)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RutaSV-Offline.apk
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk RutaSV-Offline.apk --clobber
          else
            gh release create latest-apk RutaSV-Offline.apk \
              --target "$GITHUB_SHA" \
              --title "RutaSV Offline APK" \
              --notes "Descarga directa del APK de RutaSV Offline (mapa y rutas de El Salvador 100% sin internet)."
          fi
